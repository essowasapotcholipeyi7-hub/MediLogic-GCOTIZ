<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediLogic - Caisse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f0f2f5; }
        .sidebar { min-height: 100vh; background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb4d); }
        .sidebar .nav-link { color: white; }
        .sidebar .nav-link:hover { background: rgba(255,255,255,0.2); }
        .solde { font-size: 48px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 p-0 sidebar">
                <div class="p-3 text-center">
                    <h4 class="text-white">📊 MediLogic-GCOTIZ</h4>
                    <hr class="bg-light">
                </div>
                <nav class="nav flex-column">
                    <a class="nav-link py-3 px-4" href="/"><i class="fas fa-tachometer-alt me-2"></i> Dashboard</a>
                    <a class="nav-link py-3 px-4" href="/membres"><i class="fas fa-users me-2"></i> Membres</a>
                    <a class="nav-link py-3 px-4" href="/cotisations"><i class="fas fa-money-bill me-2"></i> Cotisations</a>
                    <a class="nav-link py-3 px-4 active" href="/caisse"><i class="fas fa-box me-2"></i> Caisse</a>
                    <a class="nav-link py-3 px-4" href="/fete">
                        <i class="fas fa-glass-cheers me-2"></i> POUR FETE
                    </a>
                    <a class="nav-link py-3 px-4" href="/historique"><i class="fas fa-history me-2"></i> Historique</a>
                </nav>
            </div>
            
            <div class="col-md-10 p-4">
                <h1><i class="fas fa-box me-2"></i>Gestion de caisse</h1>
                
                <!-- Solde -->
                <div class="card bg-info text-white mb-4">
                    <div class="card-body text-center">
                        <h5>💰 Solde actuel</h5>
                        <div class="solde" id="solde">- FCFA</div>
                    </div>
                </div>
                
                <!-- Décaissement -->
                <div class="card">
                    <div class="card-header bg-danger text-white">
                        <i class="fas fa-arrow-down"></i> Décaissement (2 étapes)
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4 mb-2">
                                <input type="number" id="montant" class="form-control" placeholder="Montant à décaisser">
                            </div>
                            <div class="col-md-5 mb-2">
                                <input type="text" id="motif" class="form-control" placeholder="Motif du décaissement *">
                            </div>
                            <div class="col-md-3 mb-2">
                                <button class="btn btn-danger admin-only" onclick="demanderDecaissement()">
    <i class="fas fa-arrow-down"></i> Demander décaissement
                                </button>
                            </div>
                        </div>
                        <div id="message" class="mt-2"></div>
                    </div>
                </div>
                
                <!-- Historique opérations -->
                <div class="card mt-4">
                    <div class="card-header bg-secondary text-white">📜 Dernières opérations</div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr><th>Date</th><th>Type</th><th>Montant</th><th>Motif</th><th>Effectué par</th></tr>
                                </thead>
                                <tbody id="operations"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function chargerSolde() {
            fetch('/api/caisse/solde')
                .then(res => res.json())
                .then(data => document.getElementById('solde').innerText = data.solde + ' FCFA');
        }
        
        function chargerOperations() {
            fetch('/api/caisse/operations')
                .then(res => res.json())
                .then(data => {
                    let html = '';
                    data.forEach(op => {
                        let typeClass = op.type === 'entree' ? 'text-success' : 'text-danger';
                        let typeIcon = op.type === 'entree' ? '⬆️' : '⬇️';
                        html += `<tr>
                            <td>${new Date(op.date_operation).toLocaleString()}</td>
                            <td class="${typeClass}">${typeIcon} ${op.type}</td>
                            <td>${op.montant} FCFA</td>
                            <td>${op.motif || '-'}</td>
                            <td>${op.effectue_par || '-'}</td>
                        </tr>`;
                    });
                    document.getElementById('operations').innerHTML = html;
                });
        }
        
        function demanderDecaissement() {
            let montant = parseFloat(document.getElementById('montant').value);
            let motif = document.getElementById('motif').value;
            let demandeur = prompt("Votre nom pour validation :");
            
            if(!montant || !motif || !demandeur) {
                alert("Remplissez tous les champs");
                return;
            }
            
            // Valider en 2 étapes
            if(confirm(`⚠️ CONFIRMATION FINALE ⚠️\n\nDécaissement de ${montant} FCFA\nMotif: ${motif}\n\nCette opération est irréversible. Confirmer ?`)) {
                fetch('/api/caisse/sortie', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        montant: montant,
                        motif: motif,
                        demandeur: demandeur,
                        valide_par: demandeur
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if(data.success) {
                        document.getElementById('message').innerHTML = '<div class="alert alert-success">✅ ' + data.message + '</div>';
                        document.getElementById('montant').value = '';
                        document.getElementById('motif').value = '';
                        chargerSolde();
                        chargerOperations();
                        setTimeout(() => document.getElementById('message').innerHTML = '', 3000);
                    } else {
                        alert('❌ ' + data.message);
                    }
                });
            }
        }
        
        chargerSolde();
        chargerOperations();
        setInterval(chargerSolde, 10000);
        setInterval(chargerOperations, 30000);

    // Vérifier le rôle de l'utilisateur
    fetch('/api/session')
        .then(res => res.json())
        .then(data => {
            if(data.logged_in && data.role === 'membre') {
                // Cacher les boutons admin
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
            }
        });

    // Afficher l'utilisateur connecté
    fetch('/api/session')
        .then(res => res.json())
        .then(data => {
            if(data.logged_in) {
                let roleIcon = data.role === 'admin' ? '👑' : '👤';
                let header = document.querySelector('h1');
                if(header && !document.getElementById('userHeader')) {
                    let div = document.createElement('div');
                    div.id = 'userHeader';
                    div.style.cssText = 'display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;';
                    div.innerHTML = `
                        <h1>${header.innerHTML}</h1>
                        <div>
                            <span class="me-3">${roleIcon} ${data.nom} (${data.role === 'admin' ? 'Admin' : 'Membre'})</span>
                            <button class="btn btn-danger btn-sm" onclick="deconnexion()">
                                <i class="fas fa-sign-out-alt"></i> Déconnexion
                            </button>
                        </div>
                    `;
                    header.parentNode.insertBefore(div, header);
                    header.style.display = 'none';
                }
            }
        });
    
    function deconnexion() {
        fetch('/api/logout', {method: 'POST'})
            .then(() => window.location.href = '/login');
    }
    </script>
</body>
</html>
