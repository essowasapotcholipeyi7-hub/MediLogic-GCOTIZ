<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediLogic-GCOTIZ- Cotisations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f0f2f5; }
        .sidebar { min-height: 100vh; background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb4d); }
        .sidebar .nav-link { color: white; }
        .sidebar .nav-link:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 p-0 sidebar">
                <div class="p-3 text-center">
                    <h4 class="text-white">📊 MediLogic-GCOTIZ</h4>
                    <hr class="bg-light">
                </div>
                <nav class="nav flex-column">
                    <a class="nav-link py-3 px-4" href="/"><i class="fas fa-tachometer-alt me-2"></i> Dashboard</a>
                    <a class="nav-link py-3 px-4" href="/membres"><i class="fas fa-users me-2"></i> Membres</a>
                    <a class="nav-link py-3 px-4 active" href="/cotisations"><i class="fas fa-money-bill me-2"></i> Cotisations</a>
                    <a class="nav-link py-3 px-4" href="/caisse"><i class="fas fa-box me-2"></i> Caisse</a>
                    <a class="nav-link py-3 px-4" href="/historique"><i class="fas fa-history me-2"></i> Historique</a>
                </nav>
            </div>
            
            <div class="col-md-10 p-4">
                <h1><i class="fas fa-money-bill me-2"></i>Enregistrer une cotisation</h1>
                
                <div class="card">
                    <div class="card-header bg-success text-white">💰 Paiement mensuel</div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4 mb-2">
                                <select id="membre" class="form-select">
                                    <option value="">Chargement...</option>
                                </select>
                            </div>
                            <div class="col-md-2 mb-2">
                                <select id="mois" class="form-select">
                                    <option value="Janvier">Janvier</option><option value="Février">Février</option>
                                    <option value="Mars">Mars</option><option value="Avril">Avril</option>
                                    <option value="Mai" selected>Mai</option><option value="Juin">Juin</option>
                                    <option value="Juillet">Juillet</option><option value="Août">Août</option>
                                    <option value="Septembre">Septembre</option><option value="Octobre">Octobre</option>
                                    <option value="Novembre">Novembre</option><option value="Décembre">Décembre</option>
                                </select>
                            </div>
                            <div class="col-md-2 mb-2">
                                <input type="number" id="montant" class="form-control" placeholder="Montant FCFA">
                            </div>
                            <div class="col-md-2 mb-2">
                                <input type="text" id="enregistrePar" class="form-control" placeholder="Votre nom">
                            </div>
                            <div class="col-md-2 mb-2">
                                <button class="btn btn-success admin-only" onclick="enregistrerPaiement()">
    <i class="fas fa-save"></i> Enregistrer
                                </button>
                            </div>
                        </div>
                        <div id="message" class="mt-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let membres = [];
        
        fetch('/api/membres')
            .then(res => res.json())
            .then(data => {
                membres = data;
                let select = document.getElementById('membre');
                select.innerHTML = '<option value="">Choisir un membre</option>';
                data.forEach(m => {
                    select.innerHTML += `<option value="${m.id}" data-montant="${m.montant_mensuel}">${m.nom} - ${m.montant_mensuel} FCFA</option>`;
                });
            });
        
        document.getElementById('membre').addEventListener('change', function() {
            let selected = this.options[this.selectedIndex];
            let montant = selected.getAttribute('data-montant');
            document.getElementById('montant').value = montant;
        });
        
        function enregistrerPaiement() {
            let idMembre = document.getElementById('membre').value;
            let mois = document.getElementById('mois').value;
            let montant = document.getElementById('montant').value;
            let enregistrePar = document.getElementById('enregistrePar').value;
            
            if(!idMembre || !montant || !enregistrePar) {
                document.getElementById('message').innerHTML = '<div class="alert alert-danger">Remplissez tous les champs</div>';
                return;
            }
            
            fetch('/api/cotisations', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    id_membre: parseInt(idMembre),
                    mois: mois,
                    annee: new Date().getFullYear(),
                    montant: parseInt(montant),
                    enregistre_par: enregistrePar
                })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    document.getElementById('message').innerHTML = '<div class="alert alert-success">✅ ' + data.message + '</div>';
                    document.getElementById('membre').value = '';
                    document.getElementById('montant').value = '';
                    document.getElementById('enregistrePar').value = '';
                    setTimeout(() => document.getElementById('message').innerHTML = '', 3000);
                } else {
                    document.getElementById('message').innerHTML = '<div class="alert alert-danger">❌ ' + data.message + '</div>';
                }
            });
        }

    // Vérifier le rôle de l'utilisateur
    fetch('/api/session')
        .then(res => res.json())
        .then(data => {
            if(data.logged_in && data.role === 'membre') {
                // Cacher les boutons admin
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
            }
        });

    // Afficher l'utilisateur connecté
    fetch('/api/session')
        .then(res => res.json())
        .then(data => {
            if(data.logged_in) {
                let roleIcon = data.role === 'admin' ? '👑' : '👤';
                let header = document.querySelector('h1');
                if(header && !document.getElementById('userHeader')) {
                    let div = document.createElement('div');
                    div.id = 'userHeader';
                    div.style.cssText = 'display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;';
                    div.innerHTML = `
                        <h1>${header.innerHTML}</h1>
                        <div>
                            <span class="me-3">${roleIcon} ${data.nom} (${data.role === 'admin' ? 'Admin' : 'Membre'})</span>
                            <button class="btn btn-danger btn-sm" onclick="deconnexion()">
                                <i class="fas fa-sign-out-alt"></i> Déconnexion
                            </button>
                        </div>
                    `;
                    header.parentNode.insertBefore(div, header);
                    header.style.display = 'none';
                }
            }
        });
    
    function deconnexion() {
        fetch('/api/logout', {method: 'POST'})
            .then(() => window.location.href = '/login');
    }
    </script>
</body>
</html>
