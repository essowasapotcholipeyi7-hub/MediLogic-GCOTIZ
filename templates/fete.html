<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediLogic-GCOTIZ - Fête de fin d'année</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f0f2f5; }
        .sidebar { min-height: 100vh; background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb4d); }
        .sidebar .nav-link { color: white; }
        .sidebar .nav-link:hover { background: rgba(255,255,255,0.2); }
        .stat-card { border-radius: 15px; transition: transform 0.3s; }
        .stat-card:hover { transform: translateY(-5px); }
        .progress-custom { height: 25px; border-radius: 10px; }
        .btn-fete { background: #fdbb4d; color: #1a2a6c; }
        .btn-fete:hover { background: #f39c12; color: white; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 p-0 sidebar">
                <div class="p-3 text-center">
                    <h4 class="text-white">📊 MediLogic-GCOTIZ</h4>
                    <hr class="bg-light">
                </div>
                <nav class="nav flex-column">
                    <a class="nav-link py-3 px-4" href="/"><i class="fas fa-tachometer-alt me-2"></i> Dashboard</a>
                    <a class="nav-link py-3 px-4" href="/membres"><i class="fas fa-users me-2"></i> Membres</a>
                    <a class="nav-link py-3 px-4" href="/cotisations"><i class="fas fa-money-bill me-2"></i> Cotisations</a>
                    <a class="nav-link py-3 px-4 active" href="/fete"><i class="fas fa-glass-cheers me-2"></i> POUR FETE</a>
                    <a class="nav-link py-3 px-4" href="/caisse"><i class="fas fa-box me-2"></i> Caisse</a>
                    <a class="nav-link py-3 px-4" href="/historique"><i class="fas fa-history me-2"></i> Historique</a>
                </nav>
            </div>
            
            <!-- Main -->
            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1><i class="fas fa-glass-cheers me-2"></i>🎄 Fête de fin d'année <span id="anneeCourante"></span></h1>
                    <div class="d-flex align-items-center gap-3">
                        <div class="text-muted" id="horloge"></div>
                        <div id="userInfo"></div>
                        <button class="btn btn-danger btn-sm" onclick="deconnexion()">
                            <i class="fas fa-sign-out-alt"></i> Déconnexion
                        </button>
                    </div>
                </div>
                
                <!-- Objectif -->
                <div class="card stat-card bg-info text-white mb-4">
                    <div class="card-body text-center">
                        <h3>🎯 Objectif collecte</h3>
                        <h2 id="objectifTotal">0 FCFA</h2>
                        <p>Pour 0 membres x 5000 FCFA</p>
                    </div>
                </div>
                
                <!-- Stats -->
                <div class="row" id="stats">
                    <div class="col-md-4 mb-3">
                        <div class="card stat-card bg-success text-white">
                            <div class="card-body">
                                <h6>💰 Total collecté</h6>
                                <h2 id="totalCollecte">-</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <div class="card stat-card bg-primary text-white">
                            <div class="card-body">
                                <h6>👥 Taux participation</h6>
                                <h2 id="tauxParticipation">-</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <div class="card stat-card bg-warning text-dark">
                            <div class="card-body">
                                <h6>🏦 Solde caisse fête</h6>
                                <h2 id="soldeFete">-</h2>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Liste des membres -->
                <div class="card mt-4">
                    <div class="card-header bg-danger text-white">
                        <i class="fas fa-users"></i> État des participations
                        <button class="btn btn-sm btn-light float-end" onclick="rafraichir()">
                            <i class="fas fa-sync-alt"></i> Rafraîchir
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>Membre</th>
                                        <th>Total dû</th>
                                        <th>Payé</th>
                                        <th>Reste</th>
                                        <th>Avancement</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody id="listeMembres"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let userRole = '';
        
        function afficherInfo() {
            fetch('/api/session')
                .then(res => res.json())
                .then(data => {
                    if(data.logged_in) {
                        userRole = data.role;
                        let roleIcon = data.role === 'admin' ? '👑' : '👤';
                        document.getElementById('userInfo').innerHTML = `${roleIcon} ${data.nom}`;
                        
                        // Admin voit les boutons, membre voit seulement
                        if(data.role !== 'admin') {
                            document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
                        }
                    }
                });
        }
        
        function chargerStats() {
            fetch('/api/fete/stats')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('objectifTotal').innerText = data.objectif_total + ' FCFA';
                    document.getElementById('totalCollecte').innerText = data.total_collecte + ' FCFA';
                    document.getElementById('tauxParticipation').innerText = data.taux_participation + '%';
                    document.getElementById('soldeFete').innerText = data.solde_caisse + ' FCFA';
                });
        }
        
        function chargerMembres() {
            fetch('/api/fete/membres')
                .then(res => res.json())
                .then(data => {
                    let html = '';
                    data.forEach(m => {
                        let pourcentage = (m.montant_paye / 5000) * 100;
                        let statutClass = m.statut === 'payé' ? 'success' : (m.statut === 'partiel' ? 'warning' : 'danger');
                        let statutText = m.statut === 'payé' ? '✅ Payé' : (m.statut === 'partiel' ? '🟡 Partiel' : '🔴 Impayé');
                        
                        html += `<tr>
                            <td><strong>${m.nom}</strong></td>
                            <td>5000 FCFA</td>
                            <td class="text-success">${m.montant_paye} FCFA</td>
                            <td class="text-danger">${m.montant_restant} FCFA</td>
                            <td>
                                <div class="progress progress-custom">
                                    <div class="progress-bar bg-${statutClass}" style="width: ${pourcentage}%">${pourcentage}%</div>
                                </div>
                            </td>
                            <td>`;
                        
                        if (m.montant_restant > 0) {
                            // Bouton rappel WhatsApp
                            let tel = String(m.telephone).replace(/\s/g, '').replace(/^0/, '228').replace('+', '');
                            let message = `Bonjour ${m.nom}, Rappel de la cotisation Fête de fin d'année 2026: ${m.montant_paye} FCFA déjà payé, reste ${m.montant_restant} FCFA. Date limite: 20 décembre. Merci de régulariser pour participer à la fête. NB:La fête est obligatire pour tous!`;
                            let waUrl = `https://wa.me/${tel}?text=${encodeURIComponent(message)}`;
                            html += `<a href="${waUrl}" target="_blank" class="btn btn-wa btn-sm mb-1" title="Rappel WhatsApp"><i class="fab fa-whatsapp"></i></a>`;
                        }
                        
                        if (userRole === 'admin' && m.montant_restant > 0) {
                            html += `<button class="btn btn-sm btn-fete ms-1 admin-only" onclick="ouvrirPaiement(${m.id}, '${m.nom}', ${m.montant_restant})">
                                        <i class="fas fa-money-bill"></i> Paiement
                                     </button>`;
                        }
                        
                        html += `</td></tr>`;
                    });
                    document.getElementById('listeMembres').innerHTML = html;
                });
        }
        
        function ouvrirPaiement(id, nom, reste) {
            let montant = prompt(`Enregistrer paiement pour ${nom}\nReste à payer: ${reste} FCFA\nMontant à payer:`);
            if (montant && !isNaN(montant) && montant > 0 && montant <= reste) {
                fetch('/api/fete/payer', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({id_membre: id, montant: parseInt(montant)})
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        alert(`✅ ${data.message}`);
                        chargerStats();
                        chargerMembres();
                    } else {
                        alert(`❌ ${data.message}`);
                    }
                });
            } else {
                alert("Montant invalide !");
            }
        }
        
        function rafraichir() {
            chargerStats();
            chargerMembres();
        }
        
        function horloge() {
            let now = new Date();
            document.getElementById('horloge').innerHTML = now.toLocaleString('fr-FR');
        }
        
        function deconnexion() {
            fetch('/api/logout', {method: 'POST'})
                .then(() => window.location.href = '/login');
        }
        
        afficherInfo();
        chargerStats();
        chargerMembres();
        horloge();
        setInterval(horloge, 1000);
        setInterval(rafraichir, 30000);

// Afficher l'année dynamique
fetch('/api/fete/stats')
    .then(res => res.json())
    .then(data => {
        document.getElementById('anneeCourante').innerText = data.annee;
    });
    </script>
</body>
</html>
