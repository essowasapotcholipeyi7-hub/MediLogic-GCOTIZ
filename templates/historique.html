<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediLogic - Historique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f0f2f5; }
        .sidebar { min-height: 100vh; background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb4d); }
        .sidebar .nav-link { color: white; }
        .sidebar .nav-link:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 p-0 sidebar">
                <div class="p-3 text-center">
                    <h4 class="text-white">📊 MediLogic-GCOTIZ</h4>
                    <hr class="bg-light">
                </div>
                <nav class="nav flex-column">
                    <a class="nav-link py-3 px-4" href="/"><i class="fas fa-tachometer-alt me-2"></i> Dashboard</a>
                    <a class="nav-link py-3 px-4" href="/membres"><i class="fas fa-users me-2"></i> Membres</a>
                    <a class="nav-link py-3 px-4" href="/cotisations"><i class="fas fa-money-bill me-2"></i> Cotisations</a>
                    <a class="nav-link py-3 px-4" href="/caisse"><i class="fas fa-box me-2"></i> Caisse</a>
                    <a class="nav-link py-3 px-4" href="/fete">
                        <i class="fas fa-glass-cheers me-2"></i> POUR FETE
                    </a>
                    <a class="nav-link py-3 px-4 active" href="/historique"><i class="fas fa-history me-2"></i> Historique</a>
                </nav>
            </div>
            
            <div class="col-md-10 p-4">
                <h1><i class="fas fa-history me-2"></i>Historique des paiements</h1>
                
                <div class="card">
                    <div class="card-header bg-secondary text-white">📜 Toutes les cotisations</div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>Date</th><th>Membre</th><th>Mois</th><th>Année</th><th>Montant</th><th>Enregistré par</th>
                                    </tr>
                                </thead>
                                <tbody id="historique"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function chargerHistorique() {
            fetch('/api/cotisations/historique')
                .then(res => res.json())
                .then(data => {
                    let html = '';
                    data.forEach(h => {
                        html += `<tr>
                            <td>${new Date(h.date_paiement).toLocaleString()}</td>
                            <td><strong>${h.membre_nom}</strong></td>
                            <td>${h.mois}</td>
                            <td>${h.annee}</td>
                            <td class="text-success">${h.montant} FCFA</td>
                            <td>${h.enregistre_par || '-'}</td>
                        </tr>`;
                    });
                    document.getElementById('historique').innerHTML = html;
                });
        }
        
        chargerHistorique();
        setInterval(chargerHistorique, 30000);

    // Vérifier le rôle de l'utilisateur
    fetch('/api/session')
        .then(res => res.json())
        .then(data => {
            if(data.logged_in && data.role === 'membre') {
                // Cacher les boutons admin
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
            }
        });

    // Afficher l'utilisateur connecté
    fetch('/api/session')
        .then(res => res.json())
        .then(data => {
            if(data.logged_in) {
                let roleIcon = data.role === 'admin' ? '👑' : '👤';
                let header = document.querySelector('h1');
                if(header && !document.getElementById('userHeader')) {
                    let div = document.createElement('div');
                    div.id = 'userHeader';
                    div.style.cssText = 'display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;';
                    div.innerHTML = `
                        <h1>${header.innerHTML}</h1>
                        <div>
                            <span class="me-3">${roleIcon} ${data.nom} (${data.role === 'admin' ? 'Admin' : 'Membre'})</span>
                            <button class="btn btn-danger btn-sm" onclick="deconnexion()">
                                <i class="fas fa-sign-out-alt"></i> Déconnexion
                            </button>
                        </div>
                    `;
                    header.parentNode.insertBefore(div, header);
                    header.style.display = 'none';
                }
            }
        });
    
    function deconnexion() {
        fetch('/api/logout', {method: 'POST'})
            .then(() => window.location.href = '/login');
    }
    </script>
</body>
</html>
