<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediLogic-GCOTIZ - Tableau de bord</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f0f2f5; }
        .sidebar { min-height: 100vh; background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb4d); }
        .sidebar .nav-link { color: white; }
        .sidebar .nav-link:hover { background: rgba(255,255,255,0.2); }
        .stat-card { border-radius: 15px; transition: transform 0.3s; cursor: pointer; }
        .stat-card:hover { transform: translateY(-5px); }
        .btn-wa { background: #25D366; color: white; }
        .btn-wa:hover { background: #128C7E; color: white; }
        .status-vert { color: #27ae60; font-weight: bold; }
        .status-rouge { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 p-0 sidebar">
                <div class="p-3 text-center">
                    <h4 class="text-white">📊 MediLogic-GCOTIZ</h4>
                    <hr class="bg-light">
                </div>
                <nav class="nav flex-column">
                    <a class="nav-link py-3 px-4 active" href="/">
                        <i class="fas fa-tachometer-alt me-2"></i> Dashboard
                    </a>
                    <a class="nav-link py-3 px-4" href="/membres">
                        <i class="fas fa-users me-2"></i> Membres
                    </a>
                    <a class="nav-link py-3 px-4" href="/cotisations">
                        <i class="fas fa-money-bill me-2"></i> Cotisations
                    </a>
                    <a class="nav-link py-3 px-4" href="/caisse">
                        <i class="fas fa-box me-2"></i> Caisse
                    </a>
                    <a class="nav-link py-3 px-4" href="/fete">
                        <i class="fas fa-glass-cheers me-2"></i> POUR FETE
                    </a>
                    <a class="nav-link py-3 px-4" href="/historique">
                        <i class="fas fa-history me-2"></i> Historique
                    </a>
                </nav>
            </div>
            
            <!-- Main -->
            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1><i class="fas fa-tachometer-alt me-2"></i>Tableau de bord</h1>
                    <div class="text-muted" id="horloge"></div>
                </div>
                
                <!-- Stats -->
                <div class="row" id="stats">
                    <div class="col-md-3 mb-3">
                        <div class="card stat-card bg-primary text-white">
                            <div class="card-body">
                                <h6>Total membres</h6>
                                <h2 id="totalMembres">-</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-3">
                        <div class="card stat-card bg-success text-white">
                            <div class="card-body">
                                <h6>Taux recouvrement</h6>
                                <h2 id="tauxRecouvrement">-</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-3">
                        <div class="card stat-card bg-info text-white">
                            <div class="card-body">
                                <h6>Solde caisse</h6>
                                <h2 id="soldeCaisse">-</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-3">
                        <div class="card stat-card bg-danger text-white">
                            <div class="card-body">
                                <h6>En retard</h6>
                                <h2 id="enRetard">-</h2>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Membres en retard -->
                <div class="card mt-4">
                    <div class="card-header bg-danger text-white">
                        <i class="fas fa-bell"></i> Membres en retard ⚠️
                    </div>
                    <div class="card-body" id="retardList">
                        <p class="text-muted">Chargement...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
function chargerDashboard() {
    fetch('/api/stats')
        .then(res => res.json())
        .then(data => {
            document.getElementById('totalMembres').innerText = data.total_membres;
            document.getElementById('tauxRecouvrement').innerText = data.taux_recouvrement + '%';
            document.getElementById('soldeCaisse').innerText = data.solde_caisse + ' FCFA';
            document.getElementById('enRetard').innerText = data.en_retard;
        })
        .catch(err => console.error(err));
    
    fetch('/api/membres/retard')
        .then(res => res.json())
        .then(data => {
            let html = '';
            if (data.length === 0) {
                html = '<div class="alert alert-success">✅ Tous les membres sont à jour !</div>';
            } else {
                html = '<div class="list-group">';
                data.forEach(m => {
                    let tel = String(m.telephone).replace(/\s/g, '').replace(/^0/, '228').replace('+', '');
                    let message = `Bonjour ${m.nom}, vous avez ${m.mois_retard} mois de retard (${m.dette_totale} FCFA). Veuillez régulariser. MediLogic-GCOTIZ`;
                    let waUrl = `https://wa.me/${tel}?text=${encodeURIComponent(message)}`;
                    
                    html += `
                        <div class="list-group-item">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <strong>${m.nom}</strong>
                                    <span class="badge bg-danger ms-2">${m.mois_retard} mois ⏰</span>
                                    <span class="badge bg-warning ms-2">${m.dette_totale} FCFA</span>
                                </div>
                                <a href="${waUrl}" target="_blank" class="btn btn-wa btn-sm">
                                    <i class="fab fa-whatsapp"></i> Rappel
                                </a>
                            </div>
                            <small class="text-muted">Dette totale : ${m.dette_totale} FCFA (${m.mois_retard} mois)</small>
                        </div>
                    `;
                });
                html += '</div>';
            }
            document.getElementById('retardList').innerHTML = html;
        })
        .catch(err => console.error(err));
}
        
        function horloge() {
            let now = new Date();
            document.getElementById('horloge').innerHTML = now.toLocaleString('fr-FR');
        }
        
        chargerDashboard();
        horloge();
        setInterval(chargerDashboard, 30000);
        setInterval(horloge, 1000);

    // Vérifier le rôle de l'utilisateur
    fetch('/api/session')
        .then(res => res.json())
        .then(data => {
            if(data.logged_in && data.role === 'membre') {
                // Cacher les boutons admin
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
            }
        });

    // Afficher l'utilisateur connecté
    fetch('/api/session')
        .then(res => res.json())
        .then(data => {
            if(data.logged_in) {
                let roleIcon = data.role === 'admin' ? '👑' : '👤';
                let header = document.querySelector('h1');
                if(header && !document.getElementById('userHeader')) {
                    let div = document.createElement('div');
                    div.id = 'userHeader';
                    div.style.cssText = 'display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;';
                    div.innerHTML = `
                        <h1>${header.innerHTML}</h1>
                        <div>
                            <span class="me-3">${roleIcon} ${data.nom} (${data.role === 'admin' ? 'Admin' : 'Membre'})</span>
                            <button class="btn btn-danger btn-sm" onclick="deconnexion()">
                                <i class="fas fa-sign-out-alt"></i> Déconnexion
                            </button>
                        </div>
                    `;
                    header.parentNode.insertBefore(div, header);
                    header.style.display = 'none';
                }
            }
        });
    
    function deconnexion() {
        fetch('/api/logout', {method: 'POST'})
            .then(() => window.location.href = '/login');
    }
    </script>
</body>
</html>
