<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediLogic-GCOTIZ- Membres</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f0f2f5; }
        .sidebar { min-height: 100vh; background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb4d); }
        .sidebar .nav-link { color: white; }
        .sidebar .nav-link:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 p-0 sidebar">
                <div class="p-3 text-center">
                    <h4 class="text-white">📊 MediLogic-GCOTIZ</h4>
                    <hr class="bg-light">
                </div>
                <nav class="nav flex-column">
                    <a class="nav-link py-3 px-4" href="/"><i class="fas fa-tachometer-alt me-2"></i> Dashboard</a>
                    <a class="nav-link py-3 px-4 active" href="/membres"><i class="fas fa-users me-2"></i> Membres</a>
                    <a class="nav-link py-3 px-4" href="/cotisations"><i class="fas fa-money-bill me-2"></i> Cotisations</a>
                    <a class="nav-link py-3 px-4" href="/caisse"><i class="fas fa-box me-2"></i> Caisse</a>
                    <a class="nav-link py-3 px-4" href="/fete">
                        <i class="fas fa-glass-cheers me-2"></i> POUR FETE
                    </a>
                    <a class="nav-link py-3 px-4" href="/historique"><i class="fas fa-history me-2"></i> Historique</a>
                </nav>
            </div>
            
            <div class="col-md-10 p-4">
                <h1><i class="fas fa-users me-2"></i>Gestion des membres</h1>
                
                <!-- Formulaire ajout -->
                <div class="card mb-4">
                    <div class="card-header bg-primary text-white">➕ Ajouter un membre</div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4 mb-2">
                                <input type="text" id="nom" class="form-control" placeholder="Nom complet">
                            </div>
                            <div class="col-md-3 mb-2">
                                <input type="tel" id="telephone" class="form-control" placeholder="Téléphone (ex: 90123456)">
                            </div>
                            <div class="col-md-3 mb-2">
                                <select id="statut" class="form-select">
                                    <option value="travailleur">👔 Travailleur (1000 FCFA)</option>
                                    <option value="non_travailleur">🏠 Non travailleur (500 FCFA)</option>
                                </select>
                            </div>
                            <div class="col-md-2 mb-2">
                                <button class="btn btn-success w-100" onclick="ajouterMembre()">
                                    <i class="fas fa-save"></i> Enregistrer
                                </button>
                            </div>
                        </div>
                        <div id="message" class="mt-2"></div>
                    </div>
                </div>
                
                <!-- Liste des membres -->
                <div class="card">
                    <div class="card-header bg-secondary text-white">📋 Liste des membres</div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>ID</th><th>Nom</th><th>Téléphone</th><th>Statut</th><th>Montant</th><th>Statut cotisation</th><th>Action</th>
                                    </tr>
                                </thead>
                                <tbody id="listeMembres"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function chargerMembres() {
            fetch('/api/membres')
                .then(res => res.json())
                .then(data => {
                    let html = '';
                    data.forEach(m => {
                        let statutClass = m.statut_cotisation === 'À jour' ? 'text-success' : 'text-danger';
                        let statutText = m.statut_cotisation === 'À jour' ? '✅ À jour' : '❌ En retard';
                        html += `<tr>
                            <td>${m.id}</td>
                            <td>${m.nom}</td>
                            <td>${m.telephone}</td>
                            <td>${m.statut === 'travailleur' ? '👔 Travailleur' : '🏠 Non travailleur'}</td>
                            <td>${m.montant_mensuel} FCFA</td>
                            <td class="${statutClass}">${statutText}</td>
                            <td><button class="btn btn-danger btn-sm admin-only" onclick="supprimerMembre(${m.id})"><i class="fas fa-trash"></i></button></td>
                        </tr>`;
                    });
                    document.getElementById('listeMembres').innerHTML = html;
                });
        }
        
        function ajouterMembre() {
            let nom = document.getElementById('nom').value;
            let telephone = document.getElementById('telephone').value;
            let statut = document.getElementById('statut').value;
            
            if(!nom || !telephone) {
                document.getElementById('message').innerHTML = '<div class="alert alert-danger">Veuillez remplir tous les champs</div>';
                return;
            }
            
            fetch('/api/membres', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({nom, telephone, statut})
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    document.getElementById('message').innerHTML = '<div class="alert alert-success">Membre ajouté !</div>';
                    document.getElementById('nom').value = '';
                    document.getElementById('telephone').value = '';
                    chargerMembres();
                    setTimeout(() => document.getElementById('message').innerHTML = '', 3000);
                }
            });
        }
        
        function supprimerMembre(id) {
            if(confirm('Supprimer ce membre ?')) {
                fetch(`/api/membres/${id}`, {method: 'DELETE'})
                    .then(() => chargerMembres());
            }
        }
        
        chargerMembres();
    // Vérifier le rôle de l'utilisateur
    fetch('/api/session')
        .then(res => res.json())
        .then(data => {
            if(data.logged_in && data.role === 'membre') {
                // Cacher les boutons admin
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
            }
        });

    // Afficher l'utilisateur connecté
    fetch('/api/session')
        .then(res => res.json())
        .then(data => {
            if(data.logged_in) {
                let roleIcon = data.role === 'admin' ? '👑' : '👤';
                let header = document.querySelector('h1');
                if(header && !document.getElementById('userHeader')) {
                    let div = document.createElement('div');
                    div.id = 'userHeader';
                    div.style.cssText = 'display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;';
                    div.innerHTML = `
                        <h1>${header.innerHTML}</h1>
                        <div>
                            <span class="me-3">${roleIcon} ${data.nom} (${data.role === 'admin' ? 'Admin' : 'Membre'})</span>
                            <button class="btn btn-danger btn-sm" onclick="deconnexion()">
                                <i class="fas fa-sign-out-alt"></i> Déconnexion
                            </button>
                        </div>
                    `;
                    header.parentNode.insertBefore(div, header);
                    header.style.display = 'none';
                }
            }
        });
    
    function deconnexion() {
        fetch('/api/logout', {method: 'POST'})
            .then(() => window.location.href = '/login');
    }
    </script>
</body>
</html>
